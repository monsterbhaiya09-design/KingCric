# KingCric — Official Gradle APK build on GitHub Actions
#
# WHY THIS EXISTS (2026-10-17):
# The VM's sandbox blocks ALL Java-process outbound TCP, which breaks the
# Gradle daemon's loopback TCP socket ("Could not receive a message from
# the daemon"). Every APK produced in the VM therefore had to be assembled
# by a manual Gradle-free pipeline (bundle -> gen_snapshot -> dex -> aapt2
# -> zipalign -> apksigner). Those manual APKs passed aapt2/apksigner/
# zipalign checks locally, yet repeatedly failed to install on a real
# Realme GT 6T ("App not installed" / "isn't compatible"), even after
# fixing libdartjni.so, the Crown + Bat-Ball icon, and <uses-sdk>.
# This workflow builds the APK with REAL Gradle on GitHub's runner,
# where there is no such TCP block — the official Flutter build path.
# The artifact it produces is the ONE APK to deliver to the user.
# Do NOT replace this with another manual-pipeline APK.
#
# 2026-10-17 FAILURE + FIXES (run 39055368936):
# First run: Checkout / Java / Flutter / Pub get / Analyze (clean) /
# Test (3/3) all PASSED, but "Build release APK (real Gradle)" FAILED.
# `flutter build apk` regenerates android/gradlew + gradle-wrapper.jar
# itself (proven: `flutter pub get` does NOT, `flutter build apk` DOES),
# so a missing wrapper in the repo was NOT the cause. The Gradle
# execution itself failed — the most likely causes on a fresh
# ubuntu-latest runner for this project (compileSdk 36, NDK 28.2):
#   1. NDK 28.2.13676358 not preinstalled -> Gradle/sdkmanager must
#      download it, which needs SDK licenses accepted first.
#   2. build-tools 36.0.0 / platform android-36 not preinstalled ->
#      same download + license problem.
#   3. No explicit ANDROID_HOME / license step in the old workflow.
# Fixes applied (see WORKFLOW-FIX.md for the full list):
#   - android-actions/setup-android@v3 installs SDK 36 + build-tools
#     36.0.0 + NDK 28.2.13676358 and accepts licenses, sets ANDROID_HOME.
#   - Explicit `sdkmanager --licenses` acceptance (belt & braces).
#   - `chmod +x android/gradlew` + env-diagnostics step.
#   - Build output tee'd to build-apk.log; log uploaded + tailed on failure.
#   - Verify step no longer hardcodes build-tools/36.0.0 (falls back to
#     latest installed build-tools if 36.0.0 is absent).
#   - concurrency cancel-in-progress: a file-at-a-time push creates
#     many runs; only the latest needs to finish.
#   - android/.gitignore no longer ignores gradlew / gradle-wrapper.jar,
#     so the wrapper IS committed (self-contained repo for any push method).
#   - pubspec version bumped 1.0.0+1 -> 1.0.0+2 (versionCode 2) so the
#     new APK cannot collide with a stale partial install of versionCode 1
#     (INSTALL_FAILED_UPDATE_INCOMPATIBLE -> generic "App not installed").
#
# What it does:
#  1. Checks out the repo (the whole kingcric/ Flutter project must be the
#     repo root, or set working-directory below).
#  2. Installs Java 17 (required by Flutter 3.47 / Gradle 9 / AGP 9.1).
#  3. Installs Android SDK 36 + build-tools 36.0.0 + NDK 28.2.13676358,
#     accepts SDK licenses, sets ANDROID_HOME.
#  4. Installs Flutter 3.47.7 (the version the code was tested with:
#     `flutter analyze` = No issues found, `flutter test` = 3/3).
#  5. Runs flutter pub get -> flutter analyze -> flutter test ->
#     flutter build apk --release (REAL Gradle, with daemon).
#  6. Verifies the APK (aapt2 badging must show minSdk 24 / targetSdk 36,
#     apksigner verify, zipalign check) and prints size + sha256.
#  7. Uploads ONE artifact: app-release.apk (universal, all ABIs).

name: Build KingCric APK

on:
  push:
    branches: [main]
    paths:
      - '**.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch: {}

permissions:
  contents: read

# A file-at-a-time push creates one run per file. Only the latest run
# matters; auto-cancel superseded runs so they don't queue for hours.
concurrency:
  group: kingcric-apk
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build release APK (official Gradle)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36 + build-tools + NDK (manual sdkmanager)
        # 2026-10-18 FIX: android-actions/setup-android@v3 failed on run
        # 39057001463 at "Set up Android SDK" step (log gated behind sign-in,
        # exact error not retrievable). Replace it with direct sdkmanager
        # calls on the runner's preinstalled SDK - more transparent, no
        # third-party action dependency.
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          if [ -z "${ANDROID_HOME:-}" ]; then
            if [ -d /usr/local/lib/android/sdk ]; then
              echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
              export ANDROID_HOME=/usr/local/lib/android/sdk
            elif [ -d "$HOME/Android/Sdk" ]; then
              echo "ANDROID_HOME=$HOME/Android/Sdk" >> "$GITHUB_ENV"
              export ANDROID_HOME="$HOME/Android/Sdk"
            fi
          fi
          echo "Using ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/cmdline-tools/" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "platform-tools"
          echo "--- installed build-tools ---"
          ls "$ANDROID_HOME/build-tools/" || true
          echo "--- installed NDK ---"
          ls "$ANDROID_HOME/ndk/" || true

      - name: Set up Flutter 3.47.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Print build environment (diagnostics)
        run: |
          set -euo pipefail
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          flutter --version
          flutter doctor -v
          echo "--- installed build-tools ---"
          ls "$ANDROID_HOME/build-tools/" || true
          echo "--- installed NDK ---"
          ls "$ANDROID_HOME/ndk/" || true
          echo "--- gradlew ---"
          ls -l android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.jar || echo "NOTE: gradle-wrapper.jar absent; flutter build regenerates it"

      - name: Pub get
        run: flutter pub get

      - name: Analyze (must be clean)
        run: flutter analyze

      - name: Test (must pass 3/3)
        run: flutter test

      - name: Build release APK (real Gradle)
        run: flutter build apk --release 2>&1 | tee build-apk.log

      - name: Show build tail on failure
        if: failure()
        run: |
          echo "===== last 200 lines of build-apk.log ====="
          tail -n 200 build-apk.log || echo "(no build-apk.log found)"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kingcric-build-log
          path: build-apk.log
          if-no-files-found: warn
          retention-days: 7

      # 2026-10-18 FIX (run 39113688632): Build (real Gradle) SUCCEEDED but
      # Verify FAILED on an unknown sub-check and Upload was SKIPPED, so
      # the built APK was lost with the ephemeral runner. Verify now runs
      # EVERY sub-check (no `set -e` kill on first failure), records
      # PASS/FAIL per check into verify-report.txt, and Upload has
      # `if: always()` so the next run ALWAYS produces the APK artifact
      # even if a strict check trips. Verify still exits non-zero when
      # any strict check fails, so a tripped check stays visible.
      - name: Verify APK
        run: |
          set -u
          APK=build/app/outputs/flutter-apk/app-release.apk
          REPORT=verify-report.txt
          : > "$REPORT"
          FAIL=0
          check() { # check <label> <command...>
            local label="$1"; shift
            if "$@" >>"$REPORT" 2>&1; then
              echo "PASS: $label" | tee -a "$REPORT"
            else
              echo "FAIL: $label" | tee -a "$REPORT"
              FAIL=1
            fi
          }
          echo "=== KingCric APK verification ===" | tee -a "$REPORT"
          if [ -f "$APK" ]; then
            echo "PASS: APK file exists: $APK" | tee -a "$REPORT"
            ls -lh "$APK" | tee -a "$REPORT"
            sha256sum "$APK" | tee -a "$REPORT"
          else
            echo "FAIL: APK file exists: $APK (NOT FOUND)" | tee -a "$REPORT"
            echo "--- verify-report.txt ---"
            cat "$REPORT"
            exit 1
          fi
          # Resolve build-tools: prefer 36.0.0, fall back to latest
          # installed (ubuntu-latest does not guarantee 36.0.0).
          BT="$ANDROID_HOME/build-tools/36.0.0"
          if [ ! -d "$BT" ]; then
            BT="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)"
          fi
          echo "Using build-tools: $BT" | tee -a "$REPORT"
          check "aapt2 executable" test -x "$BT/aapt2"
          # Badging must show the package + SDKs.
          "$BT/aapt2" dump badging "$APK" | tee /tmp/badging.txt | tee -a "$REPORT"
          check "badging name='com.kingcric.app'" grep -q "name='com.kingcric.app'" /tmp/badging.txt
          check "badging minSdkVersion:'24'" grep -q "minSdkVersion:'24'" /tmp/badging.txt
          check "badging targetSdkVersion:'36'" grep -q "targetSdkVersion:'36'" /tmp/badging.txt
          check "badging supports-any-density: 'true'" grep -q "supports-any-density: 'true'" /tmp/badging.txt
          # Signature + alignment.
          check "apksigner verify" "$BT/apksigner" verify --verbose "$APK"
          check "zipalign -c -P 16" "$BT/zipalign" -c -v -P 16 4 "$APK"
          # Native libs for every ABI (Flutter + app + dartjni).
          check "native libs for all ABIs" python3 -c "
          import zipfile
          z = zipfile.ZipFile('$APK')
          names = z.namelist()
          assert z.testzip() is None, 'zip corrupt'
          for abi in ('arm64-v8a', 'armeabi-v7a', 'x86_64'):
              for lib in ('libflutter.so', 'libapp.so', 'libdartjni.so'):
                  assert f'lib/{abi}/{lib}' in names, f'missing lib/{abi}/{lib}'
          print('native libs OK for all ABIs')
          "
          echo "--- verify-report.txt ---"
          cat "$REPORT"
          if [ "$FAIL" -ne 0 ]; then
            echo "APK verification FAILED (one or more strict checks tripped) - see verify-report.txt"
            exit 1
          fi
          echo "APK verification PASSED"

      - name: Upload verify report (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kingcric-verify-report
          path: |
            verify-report.txt
            build-apk.log
          if-no-files-found: warn
          retention-days: 30

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kingcric-app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn
          retention-days: 30
